<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240">
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .panel { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 16; ry: 16; }
      .section { fill: #eaf2ff; stroke: #315ea8; stroke-width: 2; rx: 12; ry: 12; }
      .section2 { fill: #eefaf1; stroke: #2e7d4f; stroke-width: 2; rx: 12; ry: 12; }
      .section3 { fill: #fff4e8; stroke: #b35c00; stroke-width: 2; rx: 12; ry: 12; }
      .section4 { fill: #f6efff; stroke: #6f42c1; stroke-width: 2; rx: 12; ry: 12; }
      .note { fill: #fffde8; stroke: #a68b00; stroke-width: 2; rx: 10; ry: 10; }
      .state { fill: #dff5e7; stroke: #24804e; stroke-width: 2; rx: 10; ry: 10; }
      .danger { fill: #ffe7e7; stroke: #bb2d3b; stroke-width: 2; rx: 10; ry: 10; }
      .title { font: 700 28px 'SFMono-Regular', Consolas, monospace; fill: #111827; }
      .subtitle { font: 700 18px 'SFMono-Regular', Consolas, monospace; fill: #111827; }
      .label { font: 600 16px 'SFMono-Regular', Consolas, monospace; fill: #0f172a; }
      .text { font: 14px 'SFMono-Regular', Consolas, monospace; fill: #111827; }
      .small { font: 12px 'SFMono-Regular', Consolas, monospace; fill: #374151; }
      .muted { font: 12px 'SFMono-Regular', Consolas, monospace; fill: #4b5563; }
      .arrow-blue { stroke: #315ea8; stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
      .arrow-green { stroke: #24804e; stroke-width: 3; fill: none; marker-end: url(#arrowGreen); }
      .arrow-orange { stroke: #b35c00; stroke-width: 3; fill: none; marker-end: url(#arrowOrange); }
      .arrow-purple { stroke: #6f42c1; stroke-width: 3; fill: none; marker-end: url(#arrowPurple); }
      .arrow-red { stroke: #bb2d3b; stroke-width: 3; fill: none; marker-end: url(#arrowRed); stroke-dasharray: 8 6; }
      .dash-green { stroke: #24804e; stroke-width: 3; fill: none; marker-end: url(#arrowGreen); stroke-dasharray: 9 7; }
      .dash-orange { stroke: #b35c00; stroke-width: 3; fill: none; marker-end: url(#arrowOrange); stroke-dasharray: 9 7; }
      .guide { stroke: #d1d5db; stroke-width: 1; stroke-dasharray: 4 6; }
    </style>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#315ea8" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#24804e" />
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b35c00" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6f42c1" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bb2d3b" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1240" />
  <text class="title" x="40" y="48">ARMT Internal Data Interaction and TBPTT Flow</text>
  <text class="muted" x="40" y="74">Megatron-LM: microbatch/chunk scheduling, ARMTModel token flow, per-layer associative memory read/write, and TBPTT gradient boundaries.</text>

  <rect class="panel" x="30" y="100" width="1540" height="240" />
  <text class="subtitle" x="52" y="132">1. Runtime: one microbatch is moved to GPU/TP ranks, then sliced into recurrent chunks</text>

  <rect class="section" x="50" y="156" width="250" height="132" />
  <text class="label" x="68" y="184">Raw batch from dataloader</text>
  <text class="text" x="68" y="212">tokens [B, S]</text>
  <text class="text" x="68" y="234">labels [B, S]</text>
  <text class="text" x="68" y="256">loss_mask [B, S]</text>
  <text class="text" x="68" y="278">attn_mask [1, 1, S, S]</text>

  <rect class="section" x="350" y="156" width="330" height="132" />
  <text class="label" x="368" y="184">get_batch_on_this_tp_rank()</text>
  <text class="text" x="368" y="212">rank 0: next(data_iterator) + cuda()</text>
  <text class="text" x="368" y="234">broadcast batch inside TP group</text>
  <text class="text" x="368" y="256">ARMT TBPTT schedule does this internally</text>
  <text class="small" x="368" y="278">PP must be 1, CP must be 1</text>

  <rect class="section" x="730" y="156" width="360" height="132" />
  <text class="label" x="748" y="184">chunk_data(raw_batch, chunk_size, seq_len)</text>
  <text class="text" x="748" y="212">slice tensors along sequence dimension</text>
  <text class="text" x="748" y="234">slice square attention_mask to [ck, ck]</text>
  <text class="text" x="748" y="256">packed_seq_params is unsupported in v1</text>
  <text class="small" x="748" y="278">chunk_0 ... chunk_n-1, each length = chunk_size</text>

  <rect class="note" x="1140" y="156" width="390" height="132" />
  <text class="label" x="1158" y="184">Schedule controls</text>
  <text class="text" x="1158" y="212">reset_all_memory() at each new microbatch</text>
  <text class="text" x="1158" y="234">optional: no_loss_from_first_chunk -> loss_mask = 0</text>
  <text class="text" x="1158" y="256">loss weight proportional to chunk token count</text>
  <text class="text" x="1158" y="278">all chunks still run forward to write memory</text>

  <path class="arrow-blue" d="M 300 222 L 350 222" />
  <path class="arrow-blue" d="M 680 222 L 730 222" />
  <path class="arrow-blue" d="M 1090 222 L 1140 222" />

  <rect class="panel" x="30" y="370" width="1540" height="310" />
  <text class="subtitle" x="52" y="402">2. For each chunk c_k inside the same microbatch: forward, loss, chunk-wise backward, then grad finalize</text>

  <rect class="section3" x="50" y="430" width="220" height="182" />
  <text class="label" x="68" y="458">Chunk k inputs</text>
  <text class="text" x="68" y="486">tokens_k / labels_k</text>
  <text class="text" x="68" y="508">loss_mask_k / pos_ids_k</text>
  <text class="text" x="68" y="530">attn_mask_k [ck, ck]</text>
  <text class="text" x="68" y="552">chunk_tokens = sum(loss_mask_k)</text>
  <text class="small" x="68" y="584">ck = chunk_size except last chunk</text>

  <rect class="section3" x="330" y="430" width="270" height="182" />
  <text class="label" x="348" y="458">forward_step()</text>
  <text class="text" x="348" y="486">batch = next(chunk_iter)</text>
  <text class="text" x="348" y="508">output = model(tokens_k, pos_ids_k,</text>
  <text class="text" x="348" y="530">               attn_mask_k, labels, loss_mask)</text>
  <text class="text" x="348" y="552">return output, partial(loss_func, loss_mask)</text>
  <text class="small" x="348" y="584">implemented in examples/armt/train.py</text>

  <rect class="section3" x="660" y="430" width="290" height="182" />
  <text class="label" x="678" y="458">loss_func(output)</text>
  <text class="text" x="678" y="486">returns: loss, num_tokens, loss_reduced</text>
  <text class="text" x="678" y="508">loss_reduced["lm loss"] = [loss_sum, token_count]</text>
  <text class="text" x="678" y="530">schedule accumulates per-chunk and per-microbatch</text>
  <text class="text" x="678" y="552">scalar metrics are token-weighted across chunks</text>

  <rect class="section3" x="1000" y="430" width="250" height="182" />
  <text class="label" x="1018" y="458">backward_step()</text>
  <text class="text" x="1018" y="486">scaled_loss = loss * loss_weight</text>
  <text class="text" x="1018" y="508">run on each chunk if chunk_tokens &gt; 0</text>
  <text class="text" x="1018" y="530">no_sync() for all but last</text>
  <text class="text" x="1018" y="552">microbatch+chunk pair</text>

  <rect class="note" x="1300" y="430" width="230" height="182" />
  <text class="label" x="1318" y="458">After all chunks</text>
  <text class="text" x="1318" y="486">finalize_model_grads_func(...)</text>
  <text class="text" x="1318" y="508">does DP grad reduction/finalization</text>
  <text class="text" x="1318" y="530">publish per-chunk loss metrics</text>
  <text class="text" x="1318" y="552">return losses_reduced</text>

  <path class="arrow-orange" d="M 270 520 L 330 520" />
  <path class="arrow-orange" d="M 600 520 L 660 520" />
  <path class="arrow-orange" d="M 950 520 L 1000 520" />
  <path class="arrow-orange" d="M 1250 520 L 1300 520" />

  <rect class="panel" x="30" y="710" width="1540" height="230" />
  <text class="subtitle" x="52" y="742">3. ARMTModel.forward(): append learned memory tokens, run decoder stack, then strip them before LM loss</text>

  <rect class="section2" x="50" y="770" width="250" height="120" />
  <text class="label" x="68" y="798">GPT preprocess</text>
  <text class="text" x="68" y="826">token embed + position handling</text>
  <text class="text" x="68" y="848">decoder_input [S, B, H]</text>
  <text class="text" x="68" y="870">padding_mask optional</text>

  <rect class="section2" x="350" y="770" width="320" height="120" />
  <text class="label" x="368" y="798">Append learned memory_embeddings</text>
  <text class="text" x="368" y="826">decoder_input -> [context tokens | mem tokens]</text>
  <text class="text" x="368" y="848">shape: [S + M, B, H]</text>
  <text class="text" x="368" y="870">SP mode: gather seq -> append -> scatter back</text>

  <rect class="section2" x="720" y="770" width="330" height="120" />
  <text class="label" x="738" y="798">Mask and positional updates</text>
  <text class="text" x="738" y="826">attention_mask expanded to [S + M, S + M]</text>
  <text class="text" x="738" y="848">padding_mask appended with zeros for mem tokens</text>
  <text class="text" x="738" y="870">RoPE/Yarn recomputed for the longer sequence</text>

  <rect class="section2" x="1100" y="770" width="410" height="120" />
  <text class="label" x="1118" y="798">Decoder stack: N x ARMTLayer</text>
  <text class="text" x="1118" y="826">every layer can read/write associative memory</text>
  <text class="text" x="1118" y="848">hidden_states stay length [S + M] inside the stack</text>
  <text class="text" x="1118" y="870">per-layer W_mem/z persist across chunks in one microbatch</text>

  <rect class="note" x="1180" y="900" width="330" height="28" />
  <text class="small" x="1196" y="919">Before postprocess: strip tail M memory tokens -> [S, B, H], so LM loss is on context tokens only.</text>

  <path class="arrow-green" d="M 300 832 L 350 832" />
  <path class="arrow-green" d="M 670 832 L 720 832" />
  <path class="arrow-green" d="M 1050 832 L 1100 832" />

  <rect class="panel" x="30" y="970" width="1540" height="240" />
  <text class="subtitle" x="52" y="1002">4. Inside one ARMTLayer: retrieve from recurrent state, run TransformerLayer, then write tail memory tokens back</text>

  <rect class="section4" x="50" y="1030" width="260" height="140" />
  <text class="label" x="68" y="1058">Layer input</text>
  <text class="text" x="68" y="1086">hidden_states [S + M, B, H]</text>
  <text class="text" x="68" y="1108">layout is SBH only</text>
  <text class="text" x="68" y="1130">tail M rows are memory tokens</text>

  <rect class="state" x="360" y="1030" width="300" height="140" />
  <text class="label" x="378" y="1058">AssociativeLayer.associate()</text>
  <text class="text" x="378" y="1086">query: q = W_mq(hidden) -> DPFP(phi) -> normalize</text>
  <text class="text" x="378" y="1108">read: retrieved = einsum(mq, W_mem) / z</text>
  <text class="text" x="378" y="1130">first chunk: _first_chunk => retrieved = 0</text>

  <rect class="section4" x="710" y="1030" width="250" height="140" />
  <text class="label" x="728" y="1058">Residual + TransformerLayer</text>
  <text class="text" x="728" y="1086">hidden = hidden + retrieved</text>
  <text class="text" x="728" y="1108">self-attn + MLP on [S + M] tokens</text>
  <text class="text" x="728" y="1130">output keeps context and mem tokens</text>

  <rect class="state" x="1010" y="1030" width="310" height="140" />
  <text class="label" x="1028" y="1058">AssociativeLayer.update_mem()</text>
  <text class="text" x="1028" y="1086">take tail M hidden states as mem_tokens</text>
  <text class="text" x="1028" y="1108">TBPTT: mem_tokens = mem_tokens.detach()</text>
  <text class="text" x="1028" y="1130">mk/mv/mb -> delta associations -> update W_mem and z</text>

  <rect class="state" x="1370" y="1030" width="160" height="140" />
  <text class="label" x="1388" y="1058">Recurrent state</text>
  <text class="text" x="1388" y="1086">W_mem</text>
  <text class="text" x="1388" y="1108">z (optional)</text>
  <text class="text" x="1388" y="1130">per layer, per microbatch</text>

  <path class="arrow-purple" d="M 310 1100 L 360 1100" />
  <path class="arrow-purple" d="M 660 1100 L 710 1100" />
  <path class="arrow-purple" d="M 960 1100 L 1010 1100" />
  <path class="arrow-green" d="M 1320 1100 L 1370 1100" />
  <path class="dash-green" d="M 1450 1030 C 1450 980, 500 980, 500 1030" />
  <text class="small" x="1080" y="986">updated W_mem/z feed the next chunk's associate() in the same layer</text>

  <path class="dash-orange" d="M 1170 1030 C 1170 950, 870 935, 870 890" />
  <text class="small" x="873" y="905">tail M hidden states are the write source</text>

  <rect class="note" x="50" y="905" width="1070" height="24" />
  <text class="small" x="64" y="922">Gradient rule in TBPTT: later chunk loss can still train W_mk/W_mv/W_mb through W_mem/z, but detach() blocks gradients into previous chunk mem-token activations and earlier Transformer graphs.</text>

  <rect class="danger" x="1220" y="900" width="290" height="24" />
  <text class="small" x="1235" y="917">Blocked path: no gradient into previous chunk activations</text>
  <path class="arrow-red" d="M 1365 900 C 1365 875, 1180 875, 1180 1030" />

  <line class="guide" x1="30" y1="350" x2="1570" y2="350" />
  <line class="guide" x1="30" y1="690" x2="1570" y2="690" />
  <line class="guide" x1="30" y1="950" x2="1570" y2="950" />
</svg>
